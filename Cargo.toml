[package]
name = "disp"
version = "0.2.0"
edition = "2024"
authors = ["Display Configuration Tool"]
description = "A Linux (X11/RandR) tool to configure displays based on EDID detection"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"

# For configuration file watching
notify = "6.1"

x11rb = { version = "0.12", features = ["randr"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"  # Simplify panic handling for static builds
