# Display Configuration Example
#
# Generate a profile for your own layout with:
#   disp create-config --output config.toml
#
# `name` says what the display is and `edid_hash` identifies it, never the port it's
# plugged into; both are shown by `disp list --detailed`. The names and hashes below
# are examples and won't match your monitors.

# Default profile to use when no profile matches
default_profile = "laptop"

# Available profiles
[[profiles]]
name = "laptop"
description = "Laptop screen only"

  [[profiles.displays]]
  name = "ACM 1A2B"
  edid_hash = "0f1e2d3c4b5a6978"
  resolution = "1920x1080"
  orientation = "normal"
  position = [0, 0]
  scaling = 1.0
  primary = true
  enabled = true

[[profiles]]
name = "docked"
description = "External monitor to the right of the laptop screen"

  [[profiles.displays]]
  name = "ACM 1A2B"
  edid_hash = "0f1e2d3c4b5a6978"
  resolution = "1920x1080"
  orientation = "normal"
  position = [0, 0]
  scaling = 1.0
  primary = false
  enabled = true

  [[profiles.displays]]
  name = "Contoso C27"
  edid_hash = "8796a5b4c3d2e1f0"
  resolution = "2560x1440"
  orientation = "normal"
  position = [1920, 0]
  scaling = 1.0
  primary = true
  enabled = true

[[profiles]]
name = "presentation"
description = "Laptop screen with a projector that provides no EDID"

  [[profiles.displays]]
  name = "ACM 1A2B"
  edid_hash = "0f1e2d3c4b5a6978"
  resolution = "1920x1080"
  orientation = "normal"
  position = [0, 0]
  scaling = 1.0
  primary = true
  enabled = true

  [[profiles.displays]]
  name = "Unknown display"
  resolution = "1920x1080"
  orientation = "normal"
  position = [1920, 0]
  scaling = 1.0
  primary = false
  enabled = true
